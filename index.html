<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bayna - Annuaire Local & Services</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #2563eb;
            --secondary-color: #1e40af;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --text-light: #64748b;
            --border-color: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 2.5rem 1rem;
            text-align: center;
        }

        header h1 {
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
            letter-spacing: 1px;
        }

        header p {
            font-size: 1rem;
            opacity: 0.9;
        }

        .container {
            max-width: 1200px;
            margin: -30px auto 0;
            padding: 0 1rem 3rem;
            position: relative;
        }

        .filter-card {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
            margin-bottom: 2rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        @media (max-width: 768px) {
            .filter-card {
                grid-template-columns: 1fr;
            }
        }

        .filter-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-color);
            font-size: 0.9rem;
        }

        .filter-group select {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            background: white;
            color: var(--text-color);
            transition: border-color 0.2s;
        }

        .filter-group select:focus {
            border-color: var(--primary-color);
        }

        .results-section h2 {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            color: var(--text-color);
            border-left: 4px solid var(--primary-color);
            padding-left: 0.75rem;
        }

        .grid-cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid var(--border-color);
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .card-img-container {
            width: 100%;
            height: 180px;
            overflow: hidden;
            background-color: #f1f5f9;
        }

        .card-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }

        .card:hover .card-img-container img {
            transform: scale(1.05);
        }

        .card-body {
            padding: 1.25rem;
        }

        .card-category {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            background: #eff6ff;
            color: var(--primary-color);
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            margin-bottom: 0.5rem;
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .card-info {
            font-size: 0.9rem;
            color: var(--text-light);
            margin-bottom: 0.4rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .card-footer {
            padding: 1rem 1.25rem;
            background: #f8fafc;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 0.75rem;
        }

        .btn {
            flex: 1;
            padding: 0.6rem;
            border-radius: 6px;
            text-align: center;
            font-weight: 600;
            font-size: 0.9rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            transition: background 0.2s;
        }

        .btn-call {
            background-color: #10b981;
            color: white;
        }

        .btn-call:hover {
            background-color: #059669;
        }

        .btn-services {
            background-color: #f1f5f9;
            color: var(--text-color);
            border: 1px solid var(--border-color);
        }

        .btn-services:hover {
            background-color: #e2e8f0;
        }

        /* نافذة منبثقة لعرض الخدمات */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            padding: 1rem;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            max-width: 500px;
            width: 100%;
            position: relative;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        .close-modal {
            position: absolute;
            top: 1rem;
            right: 1rem;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-light);
        }

        .modal-title {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 1rem;
            color: var(--text-color);
        }

        .modal-body {
            font-size: 0.95rem;
            color: var(--text-light);
            margin-bottom: 1.5rem;
            white-space: pre-line;
        }

        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem;
            background: white;
            border-radius: 12px;
            color: var(--text-light);
            font-size: 1.1rem;
            border: 1px dashed var(--border-color);
        }
    </style>
</head>
<body>

    <header>
        <h1>Bayna</h1>
        <p>Votre annuaire local intelligent pour tous les services essentiels en Algérie</p>
    </header>

    <div class="container">
        <!-- أداة الفلترة حسب القطاع والولاية -->
        <div class="filter-card">
            <div class="filter-group">
                <label for="categoryFilter"><i class="fa-solid fa-list"></i> Sélectionnez un Secteur</label>
                <select id="categoryFilter" onchange="filterData()">
                    <option value="all">Tous les secteurs</option>
                    <option value="restaurants">Restaurants</option>
                    <option value="sweets">Pâtisseries & Gâteaux</option>
                    <option value="clinics">Cliniques & Pharmacies</option>
                    <option value="depanage">Dépannage Auto</option>
                    <option value="delivery">Livraison & Transport</option>
                    <option value="barbershop">Salons de Coiffure</option>
                    <option value="events">Salles & Fêtes</option>
                    <option value="serviceauto">Service Auto</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="wilayaFilter"><i class="fa-solid fa-location-dot"></i> Sélectionnez une Wilaya</label>
                <select id="wilayaFilter" onchange="filterData()">
                    <option value="all">Toutes les Wilayas</option>
                    <option value="Constantine">25 - Constantine</option>
                    <option value="Algiers">16 - Alger</option>
                    <option value="Oran">31 - Oran</option>
                    <option value="Annaba">23 - Annaba</option>
                </select>
            </div>
        </div>

        <!-- قسم النتائج -->
        <div class="results-section">
            <h2>Résultats de la recherche</h2>
            <div class="grid-cards" id="listingsContainer">
                <!-- يتم تعبئة النتائج تلقائياً عبر الـ JavaScript -->
            </div>
        </div>
    </div>

    <!-- نافذة منبثقة للخدمات -->
    <div class="modal" id="servicesModal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <div class="modal-title" id="modalTitle">Détails des Services</div>
            <div class="modal-body" id="modalBody">Description des services...</div>
            <button class="btn btn-call" style="width: 100%;" id="modalCallBtn"><i class="fa-solid fa-phone"></i> Appeler Maintenant</button>
        </div>
    </div>

    <script>
        // قاعدة البيانات الشاملة مع روابط الصور (Photo de profil / image)
        const database = [
            {
                id: 1,
                name: "Restaurant Le Gourmet",
                category: "restaurants",
                categoryName: "Restaurants",
                wilaya: "Constantine",
                address: "Avenue Aouati Mostefa, Constantine",
                phone: "+21331000001",
                image: "https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=500&auto=format&fit=crop&q=60",
                servicesInfo: "Menu disponible:\n- Plats traditionnels (Chakhchoukha, Tlitli)\n- Grillades et frites\n- Plats du jour variés"
            },
            {
                id: 2,
                name: "Pâtisserie La Delicia",
                category: "sweets",
                categoryName: "Pâtisseries & Gâteaux",
                wilaya: "Constantine",
                address: "Nouvelle Ville Ali Mendjeli, Constantine",
                phone: "+21331000002",
                image: "https://images.unsplash.com/photo-1509440159596-0249088772ff?w=500&auto=format&fit=crop&q=60",
                servicesInfo: "Spécialités:\n- Gâteaux traditionnels et orientaux\n- Gâteaux d'anniversaire sur commande\n- Pâtisserie fine"
            },
            {
                id: 3,
                name: "Pharmacie Centrale de Garde",
                category: "clinics",
                categoryName: "Cliniques & Pharmacies",
                wilaya: "Constantine",
                address: "Centre Ville, Constantine",
                phone: "+21331000003",
                image: "https://images.unsplash.com/photo-1586015518255-972b2f96113b?w=500&auto=format&fit=crop&q=60",
                servicesInfo: "Services médicaux:\n- Ouvert 24h/24 et 7j/7\n- Médicaments et urgences\n- Vente de matériel médical"
            },
            {
                id: 4,
                name: "Dépannage Remorquage 24/7",
                category: "depanage",
                categoryName: "Dépannage Auto",
                wilaya: "Algiers",
                address: "Autoroute Est-Ouest, Alger",
                phone: "+21321000004",
                image: "https://images.unsplash.com/photo-1619642751034-765dfdf7c58e?w=500&auto=format&fit=crop&q=60",
                servicesInfo: "Services d'urgence:\n- Remorquage de véhicules légers\n- Intervention rapide sur route\n- Dépannage batterie et pannes"
            },
            {
                id: 5,
                name: "Express Delivery Services",
                category: "delivery",
                categoryName: "Livraison & Transport",
                wilaya: "Oran",
                address: "Es Senia, Oran",
                phone: "+21341000005",
                image: "https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?w=500&auto=format&fit=crop&q=60",
                servicesInfo: "Prestations:\n- Livraison de colis à domicile\n- Transport de marchandises\n- Service rapide inter-wilayas"
            },
            {
                id: 6,
                name: "Salon de Coiffure Moderne",
                category: "barbershop",
                categoryName: "Salons de Coiffure",
                wilaya: "Constantine",
                address: "Bardo, Constantine",
                phone: "+21331000006",
                image: "https://images.unsplash.com/photo-1503951914875-452162b0f3f1?w=500&auto=format&fit=crop&q=60",
                servicesInfo: "Services:\n- Coiffure homme et soins capillaires\n- Rasage traditionnel et barbes\n- Soins du visage"
            },
            {
                id: 7,
                name: "Salle des Fêtes El Emira",
                category: "events",
                categoryName: "Salles & Fêtes",
                wilaya: "Annaba",
                address: "Boulevard de la Frontière, Annaba",
                phone: "+21338000007",
                image: "https://images.unsplash.com/photo-1519741497674-611481863552?w=500&auto=format&fit=crop&q=60",
                servicesInfo: "Organisation:\n- Location de salle pour mariages et fêtes\n- Capacité de 300 personnes\n- Décoration et sonorisation incluses"
            },
            {
                id: 8,
                name: "Vulcanisation & Pneu Express",
                category: "serviceauto",
                categoryName: "Service Auto",
                wilaya: "Constantine",
                address: "Zl Zouaghi, Constantine",
                phone: "+21331000008",
                image: "https://images.unsplash.com/photo-1486006920555-c77dce18193b?w=500&auto=format&fit=crop&q=60",
                servicesInfo: "Services auto:\n- Réparation et montage de pneus\n- Équilibrage et géométrie\n- Vidange et filtres"
            }
        ];

        // دالة لعرض البطاقات مع الصورة
        function displayListings(items) {
            const container = document.getElementById("listingsContainer");
            container.innerHTML = "";

            if (items.length === 0) {
                container.innerHTML = `
                    <div class="no-results">
                        <i class="fa-solid fa-triangle-exclamation" style="font-size: 2rem; margin-bottom: 0.5rem; display: block;"></i>
                        Aucun résultat trouvé pour cette sélection.
                    </div>
                `;
                return;
            }

            items.forEach(item => {
                const card = document.createElement("div");
                card.className = "card";
                card.innerHTML = `
                    <div class="card-img-container">
                        <img src="${item.image}" alt="${item.name}">
                    </div>
                    <div class="card-body">
                        <span class="card-category">${item.categoryName}</span>
                        <h3 class="card-title">${item.name}</h3>
                        <div class="card-info">
                            <i class="fa-solid fa-location-dot"></i>
                            <span>${item.address} (${item.wilaya})</span>
                        </div>
                    </div>
                    <div class="card-footer">
                        <a href="tel:${item.phone}" class="btn btn-call">
                            <i class="fa-solid fa-phone"></i> Appeler
                        </a>
                        <button onclick="openModal('${item.name}', \`${item.servicesInfo}\`, '${item.phone}')" class="btn btn-services">
                            <i class="fa-solid fa-circle-info"></i> Services
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // دالة الفلترة
        function filterData() {
            const selectedCategory = document.getElementById("categoryFilter").value;
            const selectedWilaya = document.getElementById("wilayaFilter").value;

            const filtered = database.filter(item => {
                const matchCategory = (selectedCategory === "all" || item.category === selectedCategory);
                const matchWilaya = (selectedWilaya === "all" || item.wilaya === selectedWilaya);
                return matchCategory && matchWilaya;
            });

            displayListings(filtered);
        }

        // فتح نافذة تفاصيل الخدمات
        function openModal(name, info, phone) {
            document.getElementById("modalTitle").innerText = name;
            document.getElementById("modalBody").innerText = info;
            document.getElementById("modalCallBtn").onclick = function() {
                window.location.href = `tel:${phone}`;
            };
            document.getElementById("servicesModal").style.display = "flex";
        }

        // إغلاق النافذة
        function closeModal() {
            document.getElementById("servicesModal").style.display = "none";
        }

        // إغلاق النافذة عند الضغط خارجها
        window.onclick = function(event) {
            const modal = document.getElementById("servicesModal");
            if (event.target === modal) {
                modal.style.display = "none";
            }
        }

        // عرض كل البيانات عند تحميل الصفحة
        window.onload = function() {
            displayListings(database);
        };
    </script>
</body>
</html>
