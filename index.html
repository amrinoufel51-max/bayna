            min-height: 100vh;
            overflow-x: hidden;

        body::before {
            content: "";

            top: 0; left: 0;
            width: 100vw; height: 100vh;

            background-size: 400% 400%;
            animation: waveBackground 12s ease infinite;
            z-index: -3;
        }

        @keyframes waveBackground {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .backdrop-fx {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: -2;
            pointer-events: none;
            overflow: hidden;
        }

        .glow-mesh {
            position: absolute;
            width: 100%; height: 100%;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(59, 130, 246, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(37, 99, 235, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(14, 165, 233, 0.03) 0%, transparent 50%);
            filter: blur(40px);

        #particles-js { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
        .particle { position: absolute; background: #38bdf8; border-radius: 50%; opacity: 0.3; animation: floatParticle linear infinite; }
        @keyframes floatParticle { 0% { transform: translateY(100vh) scale(0); } 50% { opacity: 0.6; } 100% { transform: translateY(-50px) scale(1); opacity: 0; } }

        .bubble {
            position: absolute;
            bottom: -100px;
            background: radial-gradient(circle at 30% 30%, rgba(56, 189, 248, 0.25), rgba(14, 165, 233, 0.05));
            border: 1px solid rgba(56, 189, 248, 0.15);
            border-radius: 50%;
            box-shadow: inset 0 0 10px rgba(56, 189, 248, 0.2), 0 0 15px rgba(14, 165, 233, 0.1);
            animation: riseBubble linear infinite;
        }

        @keyframes riseBubble {
            0% { transform: translateY(0) scale(1) translateX(0); opacity: 0; }
            20% { opacity: 0.5; }
            80% { opacity: 0.5; }
            100% { transform: translateY(-110vh) scale(1.2) translateX(30px); opacity: 0; }
        }

<script>
    const wilayasList = [
        "adrar", "chlef", "laghouat", "oum_el_bouaghi", "batna", "bejaia", "biskra", "bechar", 
        "blida", "bouira", "tamanrasset", "tbessa", "tlemcen", "tiaret", "tizi_ouzou", "alger", 
        "djelfa", "jijel", "setif", "saida", "skikda", "sidi_bel_abbes", "annaba", "guelma", 
        "constantine", "medea", "mostaganem", "msila", "mascara", "ouargla", "oran", "el_bayadh", 
        "illizi", "bordj_bou_arreridj", "boumerdes", "el_tarf", "tindouf", "tissemsilt", "el_oued", 
        "khenchela", "souk_ahras", "tipaza", "mila", "ain_defla", "naama", "ain_temouchent", 
        "ghardaia", "relizane", "timimoun", "bordj_badji_mokhtar", "ouled_djellal", "beni_abbes", 
        "in_guezzam", "in_salah", "janet", "el_meghaier", "el_meniaa"
    ];

    let currentSectorKey = "";
    let currentSectorName = "";
    let allItems = [];
    let filteredItems = [];
    let displayedCount = 0;
    const batchSize = 10;
    let currentMatchedWilaya = "";

    function selectSector(key, name) {
        currentSectorKey = key;
        currentSectorName = name;
        
        document.getElementById("sectorsView").style.display = "none";
        document.getElementById("searchView").style.display = "flex";
        document.getElementById("backHomeBtn").style.display = "flex";

        let mainContainer = document.getElementById("mainContainer");
        mainContainer.style.justifyContent = "flex-start";
        mainContainer.style.minHeight = "unset";

        document.getElementById("wilayaInput").focus();
    }

    function resetToSectors() {
        document.getElementById("searchView").style.display = "none";
        document.getElementById("sectorsView").style.display = "flex";
        document.getElementById("backHomeBtn").style.display = "none";

        let mainContainer = document.getElementById("mainContainer");
        mainContainer.style.justifyContent = "center";
        mainContainer.style.minHeight = "75vh";

        document.getElementById("wilayaInput").value = "";
        document.getElementById("itemNameInput").value = "";
        document.getElementById("resultsContainer").innerHTML = "";
        document.getElementById("itemNameSearchWrapper").style.display = "none";
    }

    function createParticles() {
        const container = document.getElementById("particles-js");
        for (let i = 0; i < 25; i++) {
            let p = document.createElement("div");
            p.className = "particle";
            p.style.left = Math.random() * 100 + "%";
            p.style.width = p.style.height = (Math.random() * 4 + 2) + "px";
            p.style.animationDuration = (Math.random() * 6 + 6) + "s";
            p.style.animationDelay = (Math.random() * 5) + "s";
            container.appendChild(p);
        }
    }

    function createBubbles() {
        const container = document.getElementById("bubbles-container");
        for (let i = 0; i < 15; i++) {
            let b = document.createElement("div");
            b.className = "bubble";
            let size = Math.random() * 35 + 15;
            b.style.width = size + "px";
            b.style.height = size + "px";
            b.style.left = Math.random() * 100 + "%";
            b.style.animationDuration = (Math.random() * 8 + 6) + "s";
            b.style.animationDelay = (Math.random() * 5) + "s";
            container.appendChild(b);
        }
    }

    createParticles();
    createBubbles();

    function toggleSidebar() {
        let sidebar = document.getElementById("sidebar");
        let overlay = document.getElementById("sidebarOverlay");
        
        if (sidebar.classList.contains("active")) {
            sidebar.classList.remove("active");
            overlay.style.display = "none";
        } else {
            sidebar.classList.add("active");
            overlay.style.display = "block";
        }
    }

    async function searchData() {
        let loader = document.getElementById("loader");
        loader.style.width = "100%";

        let query = document.getElementById("wilayaInput").value.trim().toLowerCase();
        let formattedQuery = query.replace(/\s+/g, "_");

        let container = document.getElementById("resultsContainer");
        let itemNameSearchWrapper = document.getElementById("itemNameSearchWrapper");
        
        container.innerHTML = "";
        allItems = [];
        filteredItems = [];
        displayedCount = 0;
        currentMatchedWilaya = "";
        itemNameSearchWrapper.style.display = "none";
        document.getElementById("itemNameInput").value = "";

        if (query === "") {
            loader.style.width = "0%";
            return;
        }

        let matchedWilaya = wilayasList.find(w => w.startsWith(formattedQuery) || w.includes(formattedQuery));

        if (!matchedWilaya) {
            loader.style.width = "0%";
            container.innerHTML = "<p class='no-result'>Wilaya introuvable...</p>";
            return;
        }

        currentMatchedWilaya = matchedWilaya;

        try {
            let partIndex = 1;
            let combinedData = [];

            while (true) {
                // اسم الملف يعتمد على الولاية والمفتاح البرمجي للقطاع (مثال: constantine_soutien_scolaire.json)
                let fileName = partIndex === 1 ? `${matchedWilaya}_${currentSectorKey}.json` : `${matchedWilaya}_${currentSectorKey}_${partIndex}.json`;
                try {
                    let response = await fetch(fileName);
                    if (!response.ok) break;
                    let data = await response.json();
                    combinedData = combinedData.concat(data);
                    partIndex++;
                } catch (e) {
                    break;
                }
            }

            if (combinedData.length === 0) {
                loader.style.width = "0%";
                container.innerHTML = `<p class='no-result'>Aucun résultat pour ${matchedWilaya.toUpperCase()} dans ce secteur.</p>`;
                return;
            }

            allItems = combinedData;
            filteredItems = combinedData;
            loader.style.width = "0%";

            itemNameSearchWrapper.style.display = "flex";
            renderMoreItems();

        } catch (error) {
            loader.style.width = "0%";
            container.innerHTML = "<p class='no-result'>Erreur de chargement.</p>";
        }
    }

    function filterByName() {
        let nameQuery = document.getElementById("itemNameInput").value.trim().toLowerCase();
        let container = document.getElementById("resultsContainer");
        
        container.innerHTML = "";
        displayedCount = 0;

        if (nameQuery === "") {
            filteredItems = allItems;
        } else {
            filteredItems = allItems.filter(item => item.name.toLowerCase().includes(nameQuery));
        }

        if (filteredItems.length === 0) {
            container.innerHTML = "<p class='no-result'>Aucun résultat trouvé avec ce nom...</p>";
            return;
        }

        renderMoreItems();
    }

    function renderMoreItems() {
        let container = document.getElementById("resultsContainer");
        let nextBatch = filteredItems.slice(displayedCount, displayedCount + batchSize);

        let detailsBtnText = (currentSectorKey === 'restaurants' || currentSectorKey === 'patisserie') ? 'Menu' : 'Détails';

        nextBatch.forEach((item) => {
            let card = document.createElement("div");
            card.className = "item-card";
            
            card.innerHTML = `
                <div class="profile-img-wrapper">
                    <img src="${item.profileImg}" alt="${item.name}" class="profile-img" loading="lazy">
                </div>
                <div class="item-info">
                    <h3>${item.name}</h3>
                    <p>📍 ${currentMatchedWilaya.toUpperCase()} — 📞 ${item.phone}</p>
                    <div class="card-actions">
                        <button class="details-trigger-btn" onclick='openModal(${JSON.stringify(item).replace(/'/g, "&#39;")})'>${detailsBtnText}</button>
                        <a href="tel:${item.phone}" class="phone-action-btn">📞 Appeler</a>
                    </div>
                </div>
            `;
            
            container.appendChild(card);
        });

        displayedCount += nextBatch.length;
    }

    window.addEventListener("scroll", () => {
        if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 300) {
            if (displayedCount < filteredItems.length) {
                renderMoreItems();
            }
        }
    });

    function openModal(item) {
        document.getElementById("modalName").innerText = item.name + " - " + currentSectorName;
        let galleryContainer = document.getElementById("modalGallery");
        galleryContainer.innerHTML = "";

        let images = item.menuImages || item.images || [];

        if (images.length === 0) {
            galleryContainer.innerHTML = "<p style='color: #94a3b8;'>Aucune image disponible pour le moment.</p>";
        } else {
            images.forEach((imgSrc) => {
                let img = document.createElement("img");
                img.src = imgSrc;
                img.className = "hd-modal-img";
                img.alt = "Image";
                img.loading = "lazy";
                galleryContainer.appendChild(img);
            });
        }

        document.getElementById("itemModal").style.display = "flex";
    }

    function closeModal() {
        document.getElementById("itemModal").style.display = "none";
    }

    function closeModalOnOutside(event) {
        let modalContent = document.querySelector(".modal-content");
        if (!modalContent.contains(event.target)) {
            closeModal();
        }
    }
