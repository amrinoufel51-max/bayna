<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bayna - Annuaire Local & Services</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #2563eb;
            --secondary-color: #1e40af;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --text-light: #64748b;
            --border-color: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 2.5rem 1rem;
            text-align: center;
        }

        header h1 {
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
            letter-spacing: 1px;
        }

        header p {
            font-size: 1rem;
            opacity: 0.9;
        }

        .container {
            max-width: 1200px;
            margin: -30px auto 0;
            padding: 0 1rem 3rem;
            position: relative;
        }

        .filter-card {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
            margin-bottom: 2rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        @media (max-width: 768px) {
            .filter-card {
                grid-template-columns: 1fr;
            }
        }

        .filter-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-color);
            font-size: 0.9rem;
        }

        .filter-group select, .filter-group input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            background: white;
            color: var(--text-color);
            transition: border-color 0.2s;
        }

        .filter-group select:focus, .filter-group input:focus {
            border-color: var(--primary-color);
        }

        .results-section h2 {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            color: var(--text-color);
            border-left: 4px solid var(--primary-color);
            padding-left: 0.75rem;
        }

        .grid-cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid var(--border-color);
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .card-img-container {
            width: 100%;
            height: 180px;
            overflow: hidden;
            background-color: #f1f5f9;
        }

        .card-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }

        .card:hover .card-img-container img {
            transform: scale(1.05);
        }

        .card-body {
            padding: 1.25rem;
        }

        .card-category {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            background: #eff6ff;
            color: var(--primary-color);
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            margin-bottom: 0.5rem;
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .card-info {
            font-size: 0.9rem;
            color: var(--text-light);
            margin-bottom: 0.4rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .card-footer {
            padding: 1rem 1.25rem;
            background: #f8fafc;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 0.75rem;
        }

        .btn {
            flex: 1;
            padding: 0.6rem;
            border-radius: 6px;
            text-align: center;
            font-weight: 600;
            font-size: 0.9rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            transition: background 0.2s;
        }

        .btn-call {
            background-color: #10b981;
            color: white;
        }

        .btn-call:hover {
            background-color: #059669;
        }

        .btn-services {
            background-color: #f1f5f9;
            color: var(--text-color);
            border: 1px solid var(--border-color);
        }

        .btn-services:hover {
            background-color: #e2e8f0;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            padding: 1rem;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            max-width: 500px;
            width: 100%;
            position: relative;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        .close-modal {
            position: absolute;
            top: 1rem;
            right: 1rem;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-light);
        }

        .modal-title {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 1rem;
            color: var(--text-color);
        }

        .modal-body {
            font-size: 0.95rem;
            color: var(--text-light);
            margin-bottom: 1.5rem;
            white-space: pre-line;
        }

        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem;
            background: white;
            border-radius: 12px;
            color: var(--text-light);
            font-size: 1.1rem;
            border: 1px dashed var(--border-color);
        }
    </style>
</head>
<body>

    <header>
        <h1>Bayna</h1>
        <p>Votre annuaire local intelligent pour tous les services essentiels en Algérie</p>
    </header>

    <div class="container">
        <!-- أداة الفلترة المحدثة -->
        <div class="filter-card">
            <div class="filter-group">
                <label for="categoryFilter"><i class="fa-solid fa-list"></i> Sélectionnez un Secteur</label>
                <select id="categoryFilter" onchange="loadAndFilterData()">
                    <option value="all">Tous les secteurs</option>
                    <option value="restaurants">Restaurants</option>
                    <option value="sweets">Pâtisseries & Gâteaux</option>
                    <option value="clinics">Cliniques & Pharmacies</option>
                    <option value="depanage">Dépannage Auto</option>
                    <option value="delivery">Livraison & Transport</option>
                    <option value="barbershop">Salons de Coiffure</option>
                    <option value="events">Salles & Fêtes</option>
                    <option value="serviceauto">Service Auto</option>
                    <option value="schools">Écoles & Cours Particuliers</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="wilayaInput"><i class="fa-solid fa-location-dot"></i> Rechercher une Wilaya (Nom ou Numéro)</label>
                <input type="text" id="wilayaInput" placeholder="Ex: Constantine, Alger, 31..." oninput="loadAndFilterData()">
            </div>
        </div>

        <!-- قسم النتائج -->
        <div class="results-section">
            <h2>Résultats de la recherche</h2>
            <div class="grid-cards" id="listingsContainer">
                <!-- يتم جلب وعرض النتائج تلقائياً من ملفات الـ JSON -->
            </div>
        </div>
    </div>

    <!-- نافذة منبثقة للخدمات -->
    <div class="modal" id="servicesModal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <div class="modal-title" id="modalTitle">Détails des Services</div>
            <div class="modal-body" id="modalBody">Description des services...</div>
            <button class="btn btn-call" style="width: 100%;" id="modalCallBtn"><i class="fa-solid fa-phone"></i> Appeler Maintenant</button>
        </div>
    </div>

    <script>
        // قائمة ملفات الـ JSON لكل القطاعات (بما فيها القطاع الجديد schools)
        const jsonFiles = [
            'restaurants.json',
            'sweets.json',
            'clinics.json',
            'depanage.json',
            'delivery.json',
            'barbershop.json',
            'events.json',
            'serviceauto.json',
            'schools.json'
        ];

        let allDatabase = [];

        // دالة لجلب البيانات من ملفات الـ JSON
        async function fetchAllData() {
            try {
                let loadedData = [];
                for (let file of jsonFiles) {
                    try {
                        let response = await fetch(file);
                        if (response.ok) {
                            let data = await response.json();
                            if (Array.isArray(data)) {
                                loadedData = loadedData.concat(data);
                            }
                        }
                    } catch (err) {
                        console.log(`Le fichier ${file} n'est pas encore créé.`);
                    }
                }
                allDatabase = loadedData;
                displayListings(allDatabase);
            } catch (error) {
                console.error("Erreur lors du chargement des données:", error);
            }
        }

        // دالة لعرض البطاقات في الواجهة
        function displayListings(items) {
            const container = document.getElementById("listingsContainer");
            container.innerHTML = "";

            if (items.length === 0) {
                container.innerHTML = `
                    <div class="no-results">
                        <i class="fa-solid fa-triangle-exclamation" style="font-size: 2rem; margin-bottom: 0.5rem; display: block;"></i>
                        Aucun commerce trouvé pour cette recherche.
                    </div>
                `;
                return;
            }

            items.forEach(item => {
                const card = document.createElement("div");
                card.className = "card";
                card.innerHTML = `
                    <div class="card-img-container">
                        <img src="${item.image}" alt="${item.name}">
                    </div>
                    <div class="card-body">
                        <span class="card-category">${item.categoryName}</span>
                        <h3 class="card-title">${item.name}</h3>
                        <div class="card-info">
                            <i class="fa-solid fa-location-dot"></i>
                            <span>${item.address} (${item.wilaya})</span>
                        </div>
                    </div>
                    <div class="card-footer">
                        <a href="tel:${item.phone}" class="btn btn-call">
                            <i class="fa-solid fa-phone"></i> Appeler
                        </a>
                        <button onclick="openModal('${item.name}', \`${item.servicesInfo}\`, '${item.phone}')" class="btn btn-services">
                            <i class="fa-solid fa-circle-info"></i> Services
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // دالة الفلترة مع حقل البحث الحر للولاية
        function loadAndFilterData() {
            const selectedCategory = document.getElementById("categoryFilter").value;
            const wilayaQuery = document.getElementById("wilayaInput").value.toLowerCase().trim();

            const filtered = allDatabase.filter(item => {
                const matchCategory = (selectedCategory === "all" || item.category === selectedCategory);
                const matchWilaya = wilayaQuery === "" || item.wilaya.toLowerCase().includes(wilayaQuery);
                return matchCategory && matchWilaya;
            });

            displayListings(filtered);
        }

        // فتح نافذة تفاصيل الخدمات
        function openModal(name, info, phone) {
            document.getElementById("modalTitle").innerText = name;
            document.getElementById("modalBody").innerText = info;
            document.getElementById("modalCallBtn").onclick = function() {
                window.location.href = `tel:${phone}`;
            };
            document.getElementById("servicesModal").style.display = "flex";
        }

        // إغلاق النافذة
        function closeModal() {
            document.getElementById("servicesModal").style.display = "none";
        }

        // إغلاق النافذة عند الضغط خارجها
        window.onclick = function(event) {
            const modal = document.getElementById("servicesModal");
            if (event.target === modal) {
                modal.style.display = "none";
            }
        }

        // تحميل البيانات تلقائياً عند فتح الصفحة
        window.onload = function() {
            fetchAllData();
        };
    </script>
</body>
</html>
